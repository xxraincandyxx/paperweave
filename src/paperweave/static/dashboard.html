<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>研脉 · 论文证据导图</title><style>/*__STYLE__*/</style></head>
<body><header class="masthead"><a class="brand" href="#"><span class="brand-mark">脉</span><span>研脉 <small>PAPERWEAVE</small></span></a><div class="offline"><span></span> 离线阅读看板</div><button id="theme" class="quiet">切换深色</button><button id="download-html" class="solid">保存看板 ↗</button></header>
<section class="paper-head"><div><div class="eyebrow">PAPER / EVIDENCE / CONNECTIONS</div><h1 id="paper-title">论文证据导图</h1><p id="paper-meta"></p></div><div class="metrics"><div><strong id="page-count">—</strong><span>论文页数</span></div><div><strong id="node-count">—</strong><span>内容节点</span></div><div><strong id="chunk-count">—</strong><span>已分析分块</span></div></div></section>
<div id="notice" class="notice" hidden></div>
<main class="workspace"><aside class="outline-pane"><div class="pane-label">01 / 内容索引 <span id="search-count"></span></div><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="搜索节点、解释与原文" aria-label="搜索节点、解释与原文"></label><div class="filter-row"><button id="all-filter" class="filter active">全部内容</button><button id="critical-filter" class="filter">局限与边界</button></div><nav id="outline" aria-label="论文节点索引"></nav><div class="outline-foot"><span class="dot"></span>摘录匹配 ≠ 语义事实核验<br><small>页码为 PDF 物理页序，从 1 开始。</small></div></aside>
<section class="map-pane"><div class="map-top"><div class="switch"><button class="active" id="mode-mindmap">思维导图</button><button id="mode-flowchart">结构关系</button></div><button id="expand" class="quiet">展开全部</button><button id="collapse" class="quiet">收起主题</button></div><div class="map-caption"><span id="map-description">沿着问题、方法与证据，读懂论文。</span><span id="render-state" role="status">Mermaid 已校验</span></div><div id="canvas" tabindex="0" aria-label="导图，可拖拽和滚轮缩放"><div id="diagram">__INITIAL_SVG__</div></div><div class="map-bottom"><span>拖拽平移 · 滚轮缩放 · 点击节点查看证据</span><div><button id="zoom-out" aria-label="缩小">−</button><button id="fit">适应</button><button id="zoom-in" aria-label="放大">＋</button></div></div><div class="export-row"><button id="export-svg">导出 SVG</button><button id="export-mmd">Mermaid 源码</button><button id="export-json">分析 JSON</button><button id="show-source">原文全文</button></div></section>
<aside class="detail-pane"><div class="pane-label">02 / 节点与证据</div><div id="detail-content"></div></aside></main>
<dialog id="source-dialog"><div class="dialog-bar"><h2>论文原文</h2><button id="close-source">关闭 ×</button></div><div class="source-tabs"><button id="source-text">提取文本</button><button id="source-pdf">原始 PDF</button><span id="source-page"></span></div><div id="source-body"></div></dialog><div id="toast" role="status" hidden></div>
<script id="paper-data" type="application/json">__PAPER_DATA__</script><script>/*__MERMAID__*/</script><script>/*__APP__*/</script></body></html>
